<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}番茄病害检测与分级系统{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        :root {
            --primary-green: #2d6a4f;
            --primary-light: #40916c;
            --primary-lighter: #52b788;
            --bg-soft: #f1f8f4;
        }
        body {
            background-color: var(--bg-soft);
            font-family: "PingFang SC", "Microsoft YaHei", "Helvetica Neue", sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .navbar {
            background: linear-gradient(135deg, var(--primary-green), var(--primary-light));
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
        }
        .navbar-brand {
            font-weight: 700;
            color: #fff !important;
            font-size: 1.25rem;
            letter-spacing: 0.5px;
        }
        .navbar-brand i { margin-right: 8px; }
        .nav-link {
            color: rgba(255,255,255,0.85) !important;
            font-weight: 500;
            padding: 8px 16px !important;
            border-radius: 8px;
            transition: all 0.2s;
        }
        .nav-link:hover, .nav-link.active {
            color: #fff !important;
            background: rgba(255,255,255,0.15);
        }
        .main-content {
            flex: 1;
            padding: 40px 0;
        }
        .card {
            border: none;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(45,106,79,0.08);
            transition: box-shadow 0.3s;
        }
        .card:hover { box-shadow: 0 6px 24px rgba(45,106,79,0.12); }
        .card-header {
            background: #fff;
            border-bottom: 1px solid #eef2f0;
            border-radius: 16px 16px 0 0 !important;
            font-weight: 600;
            color: var(--primary-green);
            padding: 16px 20px;
        }
        .btn-primary {
            background: linear-gradient(135deg, var(--primary-green), var(--primary-light));
            border: none;
            border-radius: 10px;
            padding: 10px 28px;
            font-weight: 500;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .btn-primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(45,106,79,0.3);
            background: linear-gradient(135deg, var(--primary-light), var(--primary-lighter));
        }
        .btn-outline-primary {
            border: 1.5px solid var(--primary-green);
            color: var(--primary-green);
            border-radius: 10px;
            padding: 9px 24px;
            font-weight: 500;
        }
        .btn-outline-primary:hover {
            background: var(--primary-green);
            color: #fff;
        }
        .footer {
            text-align: center;
            padding: 20px 0;
            color: #8a9a92;
            font-size: 0.85rem;
        }
        .upload-area {
            border: 2px dashed #b7d5c5;
            border-radius: 16px;
            padding: 40px 20px;
            text-align: center;
            background: #f8fcfa;
            cursor: pointer;
            transition: all 0.3s;
        }
        .upload-area:hover {
            border-color: var(--primary-lighter);
            background: #f0f9f4;
        }
        .upload-area.dragover {
            border-color: var(--primary-green);
            background: #e8f5ee;
        }
        .upload-icon {
            font-size: 3rem;
            color: var(--primary-lighter);
            margin-bottom: 12px;
        }
        .severity-badge {
            font-size: 0.95rem;
            padding: 8px 18px;
            border-radius: 20px;
            font-weight: 600;
        }
        .info-label {
            color: #6b7c74;
            font-weight: 500;
            font-size: 0.9rem;
        }
        .info-value {
            color: #1b3a2a;
            font-weight: 600;
        }
        /* 分级色条 */
        .severity-bar {
            display: flex;
            border-radius: 12px;
            overflow: hidden;
            height: 56px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }
        .severity-segment {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            color: #fff;
            opacity: 0.35;
            transition: all 0.3s;
        }
        .severity-segment.mild { background: #3498db; }
        .severity-segment.moderate { background: #f39c12; }
        .severity-segment.severe { background: #e74c3c; }
        .severity-segment.active {
            opacity: 1;
            font-size: 1.1rem;
            box-shadow: inset 0 0 0 3px rgba(255,255,255,0.5);
        }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body>

<nav class="navbar navbar-expand-lg">
    <div class="container">
        <a class="navbar-brand" href="/">
            <i class="bi bi-flower1"></i>番茄病害检测与分级系统
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navMenu">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link {% if active=='home' %}active{% endif %}" href="/"><i class="bi bi-house-door"></i> 首页</a></li>
                <li class="nav-item"><a class="nav-link {% if active=='history' %}active{% endif %}" href="/history"><i class="bi bi-clock-history"></i> 历史记录</a></li>
                <li class="nav-item"><a class="nav-link {% if active=='dashboard' %}active{% endif %}" href="/dashboard"><i class="bi bi-bar-chart"></i> 数据看板</a></li>
                <li class="nav-item"><a class="nav-link {% if active=='batch' %}active{% endif %}" href="/batch"><i class="bi bi-images"></i> 批量检测</a></li>
                <li class="nav-item"><a class="nav-link {% if active=='about' %}active{% endif %}" href="/about"><i class="bi bi-info-circle"></i> 关于系统</a></li>
            </ul>
        </div>
    </div>
</nav>

<div class="main-content">
    <div class="container">
        {% block content %}{% endblock %}
    </div>
</div>

<div class="footer">
    © 2026 番茄病害检测与分级系统 · 基于改进YOLOv8
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
{% block extra_js %}{% endblock %}
</body>
</html>
